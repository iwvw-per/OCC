name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Desktop builds (Windows, macOS, Linux)
  # ============================================
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            arch: aarch64
            os: macos
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            arch: x86_64
            os: macos
          - platform: ubuntu-22.04
            args: ''
            arch: x86_64
            os: linux
          - platform: windows-latest
            args: ''
            arch: x86_64
            os: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.os }}-${{ matrix.arch }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # 用 awk 而非 GNU sed：该步骤现在跑在各平台任务里，macOS 是 BSD sed，
          # GNU 的 `:a;N;ba` 循环会直接报 unexpected EOF。
          BODY=$(awk -v tag="## [${TAG}]" '
            index($0, tag) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md | awk 'NF { started = 1 } started')
          if [ -z "$BODY" ]; then
            BODY="No changelog entry found for ${TAG}."
          fi
          {
            printf '%s\n' "$BODY"
            printf '\n---\n\n**Desktop:** Windows (.exe), macOS (.dmg), Linux (.deb, .AppImage)\n**Mobile:** Android (.apk) — arm64, armeabi-v7a\n'
          } > /tmp/release-body.md
          {
            echo 'body<<RELEASE_BODY_EOF'
            cat /tmp/release-body.md
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      # tauri-action 自动执行 beforeBuildCommand (npm run build) + cargo build，
      # 创建/更新 Release，并上传安装包与更新包的 .sig 签名。
      #
      # ⚠️ uploadUpdaterJson 必须关掉：4 个平台任务并发写同一个 latest.json，
      # action 内部是「删除旧资产 → 重新上传」，A 删掉后 B 拿着已失效的资产 ID
      # 再去删就是 404（tauri-action issue #1270，官方确认「并行构建下 latest.json
      # 上传必然偶发 404」）。更糟的是先写完的条目会被后写方覆盖 ——
      # 实测 v2.0.68：latest.json 只剩 darwin-aarch64 两个平台，Windows / Linux /
      # macOS x64 用户全部收不到自动更新。
      #
      # 现在改为「构建与上传产物」和「生成 latest.json」分离：本 job 只传产物，
      # latest.json 由下面的 publish-latest-json 在所有平台完成后统一写一次。
      # createUpdaterArtifacts 需要签名私钥，缺失会导致构建失败。
      - name: Build and publish desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'OCC ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'canary') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          uploadUpdaterJson: false
  # ============================================
  # Android builds (arm64 + armv7 并行)
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust_target: aarch64-linux-android
            label: arm64
          - target: armv7
            rust_target: armv7-linux-androideabi
            label: armv7
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # packages 默认值是 'tools platform-tools'，而 Google 已把 'tools' 从 SDK
      # 仓库移除 → sdkmanager 报 "Failed to find package 'tools'" 直接失败。
      # 这里只装 platform-tools，NDK 由下一步显式安装。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - run: sdkmanager "ndk;29.0.14206865"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android-${{ matrix.target }}

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src-tauri/gen/android/.gradle
          key: gradle-${{ matrix.target }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: npm ci

      - name: Setup Android signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Build and sign APK
        run: |
          VERSION=${{ github.ref_name }}
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -1)"

          npx tauri android build --apk --target ${{ matrix.target }}

          SIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*-signed*' -name '*.apk' -type f 2>/dev/null | head -1)
          RELEASE_APK=$(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*.apk' -name '*.apk' -type f 2>/dev/null | head -1)
          APK_PATH="${SIGNED_APK:-$RELEASE_APK}"
          DEST="OCC-${VERSION}-android-${{ matrix.label }}.apk"

          if $BT/apksigner verify "$APK_PATH" 2>/dev/null; then
            cp "$APK_PATH" "$DEST"
          else
            $BT/zipalign -v 4 "$APK_PATH" "${APK_PATH}.aligned"
            $BT/apksigner sign \
              --ks $RUNNER_TEMP/keystore.jks \
              --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
              --ks-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
              --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
              --out "$DEST" "${APK_PATH}.aligned"
          fi

          mkdir -p release-artifacts
          mv "$DEST" release-artifacts/
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-android-${{ matrix.label }}
          path: release-artifacts/*
          retention-days: 1

  # ============================================
  # Publish Android assets
  #
  # 桌面安装包、更新包、.sig 与 latest.json 由上面的 tauri-action 直接发布；
  # 这里只把 Android APK 追加到同一个 Release。用 gh 上传（而非 action-gh-release）
  # 以免覆盖 tauri-action 写入的 release 正文。
  # ============================================
  publish-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-desktop, build-android]
    # 桌面矩阵里任何一个平台失败（例如 macOS 两架构并发上传 latest.json
    # 撞车），`needs` 默认会把本 job 一起跳过，导致 APK 全部丢失
    # —— 实测 v2.0.68：macOS x86_64 上传 latest.json 报 404，
    # publish-android 被 skipped，Release 只剩 13 个资产、没有 APK。
    #
    # 这里改成「只要 Android 构建成功就上传」：APK 与桌面产物互不依赖，
    # 不该因为另一个平台失败而一起丢掉。
    if: ${{ always() && needs.build-android.result == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: artifacts-android-*
          merge-multiple: true

      - name: Display artifacts
        run: ls -R artifacts

      - name: Upload Android APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" artifacts/* --clobber

  # ============================================
  # latest.json（自动更新清单）—— 必须串行
  #
  # 为什么单独一个 job：tauri-action 写 latest.json 是「删旧资产 → 重传」，
  # 4 个平台并发时必然偶发 404（官方 issue #1270），且后写方会覆盖先写方的
  # 平台条目 —— 实测 v2.0.68 只剩 darwin-aarch64，Windows/Linux/macOS x64
  # 用户收不到自动更新。
  #
  # 这里在所有桌面构建完成后，从 Release 上按产物重新拼出完整清单，只写一次。
  # 每个平台的 signature 直接读对应 .sig 资产（内容就是 minisign 签名原文），
  # 与 tauri 生成的一致。
  # ============================================
  publish-latest-json:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-desktop]
    if: ${{ always() && needs.build-desktop.result == 'success' }}
    steps:
      - name: Build latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # 平台的产物名与签名文件一一对应（与 tauri-action 的命名保持一致）
          python3 - "$VERSION" <<'PY'
          import json, os, subprocess, sys
          from datetime import datetime, timezone

          version = sys.argv[1]
          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]

          def asset_text(name):
              return subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/releases/tags/{tag}",
                   "--jq", f'.assets[] | select(.name=="{name}") | .id'],
                  text=True).strip()

          def fetch_asset(asset_name):
              aid = asset_text(asset_name)
              if not aid:
                  return None
              return subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/releases/assets/{aid}",
                   "-H", "Accept: application/octet-stream"],
                  text=True).strip()

          # platform key -> 承载签名的产物文件
          PLATFORMS = {
              "darwin-aarch64": "OCC_aarch64.app.tar.gz.sig",
              "darwin-aarch64-app": "OCC_aarch64.app.tar.gz.sig",
              "darwin-x86_64": "OCC_x64.app.tar.gz.sig",
              "darwin-x86_64-app": "OCC_x64.app.tar.gz.sig",
              "linux-x86_64": f"OCC_{version}_amd64.AppImage.sig",
              "linux-x86_64-appimage": f"OCC_{version}_amd64.AppImage.sig",
              "linux-x86_64-deb": f"OCC_{version}_amd64.deb.sig",
              "windows-x86_64": f"OCC_{version}_x64-setup.exe.sig",
              "windows-x86_64-nsis": f"OCC_{version}_x64-setup.exe.sig",
          }
          # platform key -> 更新包（updater 下载的正是这个）
          URLS = {
              "darwin-aarch64": "OCC_aarch64.app.tar.gz",
              "darwin-aarch64-app": "OCC_aarch64.app.tar.gz",
              "darwin-x86_64": "OCC_x64.app.tar.gz",
              "darwin-x86_64-app": "OCC_x64.app.tar.gz",
              "linux-x86_64": f"OCC_{version}_amd64.AppImage",
              "linux-x86_64-appimage": f"OCC_{version}_amd64.AppImage",
              "linux-x86_64-deb": f"OCC_{version}_amd64.deb",
              "windows-x86_64": f"OCC_{version}_x64-setup.exe",
              "windows-x86_64-nsis": f"OCC_{version}_x64-setup.exe",
          }

          platforms = {}
          for key, sig_asset in PLATFORMS.items():
              sig = fetch_asset(sig_asset)
              if not sig:
                  print(f"skip {key}: 找不到 {sig_asset}")
                  continue
              platforms[key] = {
                  "signature": sig,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{URLS[key]}",
              }

          if not platforms:
              print("没有任何平台签名，放弃生成 latest.json")
              sys.exit(1)

          # notes 取自 CHANGELOG 的本版本段落（Release 正文同源）
          notes = ""
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              start = text.index(f"## [{tag}]")
              rest = text[start:].split("\n", 1)[1]
              notes = rest.split("\n## ")[0].strip()
          except Exception as e:
              print(f"读取 CHANGELOG 失败（不影响更新清单）: {e}")

          out = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          open("latest.json", "w", encoding="utf-8").write(
              json.dumps(out, ensure_ascii=False, indent=2))
          print(f"latest.json 生成完成，平台数={len(platforms)}")
          for k in sorted(platforms):
              print("  ", k, "->", platforms[k]["url"].split("/")[-1])
          PY

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" latest.json --clobber
